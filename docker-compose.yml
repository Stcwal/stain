version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: encore run --listen 0.0.0.0:4000
    restart: unless-stopped

networks:
  default:
    name: webapp-network
